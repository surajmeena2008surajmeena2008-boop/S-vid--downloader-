<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2a0a55">
<title>Online Downloader</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#05030d;--hi:#a020f0;--deep:#2a0a55;--soft:#d9b8ff;--cyan:#4df0f0;--danger:#ff7a8a;--ok:#7dffb0;--glow:#0e5a66aa;--hi-a:#a020f0aa;--hero-top:#52009e;--hero-bot:#12031f;--card-top:#7b0fc4;--card-bot:#1b0536;--dl-top:#12081f;--dl-bot:#4a2f80;--chip-bg:#1b0536;--chip-bd:#5a2a96;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:#fff;font-family:Inter,system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 38% 8%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 71% 22%,#cfe,transparent),radial-gradient(1px 1px at 88% 12%,#fff,transparent),
    radial-gradient(1px 1px at 22% 52%,#fff,transparent),radial-gradient(1.5px 1.5px at 64% 64%,#fff,transparent),
    radial-gradient(1px 1px at 91% 78%,#fff,transparent),radial-gradient(1px 1px at 8% 86%,#fff,transparent),
    radial-gradient(60% 40% at 15% 100%,var(--glow),transparent),var(--bg)}
.app{max-width:480px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:16px}
.disp{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 10%,var(--hi) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{width:76px;height:auto;border-radius:18px;flex:none;display:block}
.tag{text-align:right;font-size:30px;line-height:1}.tag span{display:block}
.tag .w{background:none;-webkit-text-fill-color:#fff}
.social{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.social img{height:42px;width:auto;opacity:.6;transition:opacity .2s,transform .2s,filter .2s}
.social img.on{opacity:1;transform:scale(1.15);filter:drop-shadow(0 0 8px var(--hi))}
.social img.soon{opacity:.25;filter:grayscale(.7)}
.hero{border-radius:28px;padding:14px 20px 26px;background:linear-gradient(180deg,var(--hero-top),var(--hero-bot) 95%)}
.hero h1{margin:0;font-size:76px;line-height:.95}
.hero p{margin:6px 0 0;color:var(--soft);font-size:15px}
.row{display:flex;gap:10px;align-items:stretch}
.field{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:0 10px 0 14px;min-width:0}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:#111;padding:16px 0}
.field input::placeholder{color:#777}.field:focus-within{box-shadow:0 0 0 3px var(--hi)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.clr{background:none;color:var(--chip-bd);font-size:26px;line-height:1;padding:6px 8px;display:none}
.go{width:68px;border-radius:18px;font-size:34px;background:linear-gradient(180deg,var(--hi),var(--deep))}
.go span{color:#fff}
.msg{min-height:20px;margin:-6px 4px 0;font-size:14px}.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border-radius:28px;padding:18px 10px 20px;background:linear-gradient(180deg,var(--card-top),var(--card-bot) 90%);display:flex;flex-direction:column;align-items:center;gap:10px;
  border:3px solid transparent;transition:border-color .2s,box-shadow .2s,opacity .2s;opacity:.6}
.opt[aria-pressed="true"]{opacity:1;border-color:#fff;box-shadow:0 0 26px var(--hi-a)}
.opt small{font-size:14px;color:var(--soft);margin-top:-8px}
.opt svg{width:84px;height:70px}.opt .disp{font-size:38px}
.q{display:flex;flex-wrap:wrap;gap:8px;margin-top:-2px}
.chip{border-radius:999px;padding:9px 14px;background:var(--chip-bg);border:2px solid var(--chip-bd);font-size:14px;font-weight:600;color:var(--soft)}
.chip[aria-checked="true"]{background:linear-gradient(180deg,var(--card-top),var(--deep));border-color:#fff;color:#fff}
.themebtn{margin-right:auto;width:42px;height:42px;border-radius:50%;background:var(--chip-bg);border:2px solid var(--chip-bd);display:grid;place-items:center}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.sp{position:relative;width:100%;max-width:480px;background:var(--chip-bg);border:2px solid var(--chip-bd);border-bottom:0;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sp h2{margin:0 0 12px;font-size:40px}.sp p{margin:14px 0 8px;font-size:14px;color:var(--soft)}
.sws{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid transparent}.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 14px var(--hi-a)}
.cust{display:flex;gap:14px;align-items:center;font-size:14px}.cust label{display:flex;align-items:center;gap:8px}
.cust input{width:46px;height:46px;border:0;padding:0;background:none;border-radius:10px}
.srow{display:flex;gap:10px;margin-top:16px}.srow button{flex:1;border-radius:16px;padding:13px;font-weight:600;background:var(--deep);border:2px solid var(--chip-bd)}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:13px}.foot a{color:var(--soft)}
.prev{border-radius:28px;background:#444;min-height:200px;display:grid;place-items:center;overflow:hidden;width:100%;margin-inline:auto}
.prev .ph{font-size:76px;line-height:1;background:none;-webkit-text-fill-color:#9a9a9a;color:#9a9a9a}
.prev video,.prev img{display:none;width:100%;height:100%;background:#000;object-fit:contain}
.prev.has{background:#000;min-height:0}.prev.has .ph{display:none}
.prev.has.vid video{display:block}.prev.has.pic img{display:block}
.ptitle{margin:-8px 6px 0;font-size:14px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none}
.dl{display:flex;align-items:center;justify-content:space-between;width:100%;border-radius:26px;padding:10px 28px;background:linear-gradient(180deg,var(--dl-top),var(--dl-bot))}
.dl .disp{font-size:56px}.dl:disabled{opacity:.45;cursor:not-allowed}
.bar{height:6px;border-radius:3px;background:#ffffff22;overflow:hidden;display:none}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--hi));transition:width .3s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <svg viewBox="0 0 84 70" fill="#000"><circle cx="26" cy="16" r="12"/><circle cx="52" cy="16" r="12"/><rect x="8" y="28" width="52" height="36" rx="8"/><path d="M62 40l18-10v32L62 52z"/></svg>
      <span class="disp">Original</span><small>video</small>
    </button>
  </div>

  <div class="q" id="q" role="radiogroup" aria-label="Quality"></div>

  <section class="prev" id="prev" aria-label="Preview">
    <span class="ph disp" id="ph">Preview</span>
    <video id="pv" controls playsinline preload="metadata"></video>
    <img id="pimg" alt="Video thumbnail">
  </section>
  <div class="ptitle" id="ptitle"></div>

  <div class="bar" id="bar"><b id="fill"></b></div>
  <button class="dl" id="dl" disabled>
    <span class="disp">Download</span>
    <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a6a"/><stop offset="1" stop-color="#3fd6d6"/></linearGradient></defs><rect x="4" y="10" width="48" height="40" rx="12" fill="url(#g)"/><path d="M28 20v20m-8-8 8 8 8-8" stroke="#1a0b33" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <nav class="foot" aria-label="Info"><a href="/#guide">How to use</a><a href="/#limits">Limits</a><a href="/#terms">Terms</a><a href="/#privacy">Privacy</a></nav>
</main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Choose colours">
  <div class="sbg" id="sbg"></div>
  <div class="sp">
    <h2 class="disp">Theme</h2>
    <div class="sws" id="sws"></div>
    <p>Or pick your own two colours (text stays white)</p>
    <div class="cust"><label>Colour 1 <input type="color" id="c1" aria-label="Colour 1"></label><label>Colour 2 <input type="color" id="c2" aria-label="Colour 2"></label></div>
    <div class="srow"><button type="button" id="rst">Reset</button><button type="button" id="done">Done</button></div>
  </div>
</div>

<script>
var API_URL = "/api/download";
var PREVIEW_URL = "/api/preview";
var VIDEO_URL = "/api/preview-video";

var SITES = {
  pinterest:/(^|\.)(pinterest\.[a-z.]+|pin\.it)$/i,
  facebook:/(^|\.)(facebook\.com|fb\.watch|fb\.com)$/i,
  instagram:/(^|\.)instagram\.com$/i,
  youtube:/(^|\.)(youtube\.com|youtu\.be)$/i,
  twitter:/(^|\.)(twitter\.com|x\.com)$/i
};
var $ = function(id){return document.getElementById(id)};
var url=$("url"), msg=$("msg"), dl=$("dl"), prev=$("prev"), pv=$("pv"), pimg=$("pimg"), fmt="video", site=null, token=0, heights=[], qsel="best", STEPS=[2160,1440,1080,720,480,360,240];

function say(t,c){msg.textContent=t;msg.className="msg "+(c||"")}
function light(p){document.querySelectorAll("#social img, .social img").forEach(function(i){i.classList.toggle("on",i.dataset.p===p)})}
function resetPreview(){
  token++; pv.onerror=null; pv.pause(); pv.removeAttribute("src"); pv.removeAttribute("poster"); pv.load();
  pimg.removeAttribute("src"); prev.className="prev"; prev.style.aspectRatio=""; prev.style.width="";
  $("ph").textContent="Preview"; $("ptitle").style.display="none"; heights=[]; chips();
}
function check(){
  var v=url.value.trim(); site=null; light(null); dl.disabled=true;
  if(!v){say("");return false}
  var u;
  try{u=new URL(/^https?:\/\//i.test(v)?v:"https://"+v)}catch(e){say("That isn’t a valid link. Paste the full address.","err");return false}
  for(var k in SITES){ if(SITES[k].test(u.hostname)){site=k;break} }
  if(!site){say("This site isn’t supported. Use Instagram, Facebook, Pinterest or Twitter.","err");return false}
  if(site==="youtube"){say("YouTube isn’t supported yet. Try an Instagram, Facebook, Pinterest or Twitter link.","err");return false}
  light(site); dl.disabled=false; say("Link looks good. Tap Go for a preview, or Download.","ok"); return true;
}
function fit(w,h){ if(!w||!h)return; prev.style.aspectRatio=w+" / "+h; prev.style.width="min(100%, "+(70*w/h).toFixed(2)+"vh)" }
pimg.onload=function(){fit(pimg.naturalWidth,pimg.naturalHeight)};
pv.addEventListener("loadedmetadata",function(){fit(pv.videoWidth,pv.videoHeight)});
function showPic(src){pimg.src=src;prev.classList.add("has","pic")}
function post(u,body){
  return fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||("Server returned "+r.status));return j})})
}
function loadPreview(){
  var my=++token, link=url.value.trim(); $("ph").textContent="Loading…"; prev.className="prev"; say("Loading preview…");
  post(PREVIEW_URL,{url:link}).then(function(j){
    if(my!==token)return;
    heights=j.heights||[]; chips();
    if(j.title){$("ptitle").textContent=j.title;$("ptitle").style.display="block"}
    if(j.thumbnail){showPic(j.thumbnail)}
    say("Loading video… this can take a few seconds.");
    return post(VIDEO_URL,{url:link}).then(function(v){
      if(my!==token)return;
      pv.onerror=function(){ prev.classList.remove("vid"); if(j.thumbnail)prev.classList.add("pic"); say("This video can’t play here, but Download still works.","err") };
      if(j.thumbnail)pv.poster=j.thumbnail;
      pv.src=v.video_url; prev.classList.remove("pic"); prev.classList.add("has","vid");
      say("Preview ready. Pick a format and download.","ok");
    });
  }).catch(function(e){ if(my!==token)return; if(!prev.classList.contains("has"))$("ph").textContent="Preview"; say("No video preview: "+e.message+". Download still works.","err") });
}
$("go").onclick=function(){ if(check()) loadPreview() };
url.addEventListener("input",function(){ $("clr").style.display=url.value?"block":"none"; resetPreview(); check() });
url.addEventListener("keydown",function(e){if(e.key==="Enter"){$("go").click()}});
$("clr").onclick=function(){url.value="";$("clr").style.display="none";resetPreview();check();url.focus()};

function chips(){
  var list=[];
  if(fmt==="audio"){ list=[["best","Original"],["320","MP3 320 kbps"],["192","MP3 192 kbps"],["128","MP3 128 kbps"]] }
  else{
    var top=heights.length?heights[0]:0;
    list=[["best",top?"Original ("+top+"p)":"Original"]];
    STEPS.forEach(function(h){ if(top?h<top:h<=1080) list.push([String(h),h+"p"]) });
  }
  if(!list.some(function(x){return x[0]===qsel})) qsel="best";
  var box=$("q"); box.innerHTML="";
  list.forEach(function(x){
    var b=document.createElement("button"); b.type="button"; b.className="chip"; b.setAttribute("role","radio");
    b.setAttribute("aria-checked",x[0]===qsel); b.textContent=x[1];
    b.onclick=function(){qsel=x[0];chips()}; box.appendChild(b);
  });
}
function pick(f){fmt=f;$("optA").setAttribute("aria-pressed",f==="audio");$("optV").setAttribute("aria-pressed",f==="video");chips()}
$("optA").onclick=function(){pick("audio")};
$("optV").onclick=function(){pick("video")};

dl.onclick=function(){
  if(!check())return;
  var bar=$("bar"),fill=$("fill"); bar.style.display="block"; fill.style.width="30%"; dl.disabled=true; say("Preparing your file…");
  fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url:url.value.trim(),format:fmt,quality:qsel})})
  .then(function(r){
    if(!r.ok)throw new Error("Server returned "+r.status);
    fill.style.width="70%";
    if((r.headers.get("content-type")||"").indexOf("json")>-1) return r.json().then(function(j){return {href:j.url,name:null}});
    var cd=r.headers.get("content-disposition")||"", m=cd.match(/filename\*=UTF-8''([^;]+)/i), n=null;
    if(m){n=decodeURIComponent(m[1])}else{m=cd.match(/filename="?([^";]+)"?/i); if(m)n=m[1]}
    return r.blob().then(function(b){return {href:URL.createObjectURL(b),name:n}});
  })
  .then(function(o){
    var a=document.createElement("a"); a.href=o.href; a.download=o.name||(fmt==="audio"?(qsel==="best"?"audio.m4a":"audio.mp3"):"video.mp4");
    document.body.appendChild(a); a.click(); a.remove();
    fill.style.width="100%"; say("Download started.","ok");
  })
  .catch(function(e){say("Download failed: "+e.message+". Check the link and try again.","err")})
  .then(function(){dl.disabled=false;setTimeout(function(){bar.style.display="none";fill.style.width="0"},1500)});
};
chips();
var DEF=["#a020f0","#14b8c8"];
function _h(x){var r=parseInt(x.substr(1,2),16)/255,g=parseInt(x.substr(3,2),16)/255,b=parseInt(x.substr(5,2),16)/255,M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m,h=0,l=(M+m)/2,s=d?d/(1-Math.abs(2*l-1)):0;if(d){h=M==r?((g-b)/d)%6:M==g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,s*100,l*100]}
function _x(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l),f=function(n){var k=(n+h/30)%12,c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return("0"+Math.round(255*c).toString(16)).slice(-2)};return"#"+f(0)+f(8)+f(4)}
function applyTheme(c1,c2){var a=_h(c1),b=_h(c2),L=Math.min(62,Math.max(45,a[2])),M=Math.min(70,Math.max(52,b[2])),st=document.documentElement.style,v=function(k,x){st.setProperty(k,x)};
v("--hi",_x(a[0],a[1],L));v("--hi-a",_x(a[0],a[1],L)+"aa");v("--deep",_x(a[0],a[1],20));v("--card-top",_x(a[0],a[1],Math.min(L-8,42)));v("--card-bot",_x(b[0],b[1],10));v("--hero-top",_x(a[0],a[1],32));v("--hero-bot",_x(b[0],b[1],7));v("--dl-top",_x(b[0],b[1],8));v("--dl-bot",_x(a[0],a[1],30));v("--chip-bg",_x(b[0],b[1],11));v("--chip-bd",_x(a[0],a[1],38));v("--cyan",_x(b[0],b[1],M));v("--glow",_x(b[0],b[1],26)+"aa");v("--soft",_x(a[0],Math.min(a[1],90),85));
var t=document.querySelector("meta[name=theme-color]");if(t)t.content=_x(a[0],a[1],20)}
function loadTheme(){var t=DEF;try{var j=JSON.parse(localStorage.getItem("theme")||"null");if(j&&/^#[0-9a-f]{6}$/i.test(j[0])&&/^#[0-9a-f]{6}$/i.test(j[1]))t=j}catch(e){}applyTheme(t[0],t[1]);return t}
function saveTheme(c1,c2){try{localStorage.setItem("theme",JSON.stringify([c1,c2]))}catch(e){}}
var THEME=loadTheme();

var PRE=[["Galaxy","#a020f0","#14b8c8"],["Ocean","#1e6bff","#00d4c8"],["Sunset","#ff5a1f","#ff2d75"],["Forest","#1faa59","#b6e22e"],["Rose","#ff3d8b","#9b3dff"],["Fire","#e8261a","#ffb300"],["Mint","#00c9a7","#2f7bff"],["Berry","#b5179e","#4361ee"],["Gold","#f5a300","#d6336c"],["Steel","#5b7db1","#9aa5b1"]];
function setT(a,b){THEME=[a,b];applyTheme(a,b);saveTheme(a,b);$("c1").value=a;$("c2").value=b;
  document.querySelectorAll(".sw").forEach(function(s){s.setAttribute("aria-pressed",s.dataset.a===a&&s.dataset.b===b)})}
PRE.forEach(function(p){var s=document.createElement("button");s.type="button";s.className="sw";s.dataset.a=p[1];s.dataset.b=p[2];s.setAttribute("aria-label",p[0]);s.title=p[0];
  s.style.background="linear-gradient(135deg,"+p[1]+" 50%,"+p[2]+" 50%)";s.onclick=function(){setT(p[1],p[2])};$("sws").appendChild(s)});
function openS(o){$("sheet").hidden=!o;$("themeBtn").setAttribute("aria-expanded",o);if(o)$("done").focus();else $("themeBtn").focus()}
$("themeBtn").onclick=function(){openS(true)};$("sbg").onclick=$("done").onclick=function(){openS(false)};
$("rst").onclick=function(){setT(DEF[0],DEF[1])};
$("c1").oninput=$("c2").oninput=function(){setT($("c1").value,$("c2").value)};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("sheet").hidden)openS(false)});
setT(THEME[0],THEME[1]);
</script>
</body>
</html>
